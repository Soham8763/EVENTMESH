services:
  postgres:
    image: postgres:15
    container_name: eventmesh-postgres
    environment:
      POSTGRES_USER: eventmesh
      POSTGRES_PASSWORD: eventmesh
      POSTGRES_DB: eventmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eventmesh-redis
    ports:
      - "6380:6379"

  redpanda:
    image: redpandadata/redpanda:v23.3.3
    container_name: eventmesh-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "internal://0.0.0.0:9092,external://0.0.0.0:19092"
      - --advertise-kafka-addr
      - "internal://redpanda:9092,external://127.0.0.1:19092"
    ports:
      - "19092:19092"
      - "9644:9644"

  prometheus:
    image: prom/prometheus
    container_name: eventmesh-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana
    container_name: eventmesh-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
