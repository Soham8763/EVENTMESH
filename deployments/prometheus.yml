global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'event-ingestor'
    static_configs:
      - targets: ['event-ingestor:2112']

  - job_name: 'workflow-orchestrator'
    static_configs:
      - targets: ['workflow-orchestrator:2113']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:2114']

  - job_name: 'state-projector'
    static_configs:
      - targets: ['state-projector:2115']

  - job_name: 'rule-engine'
    static_configs:
      - targets: ['rule-engine:2117']
